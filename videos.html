<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频课程 · 动手学昇腾算子开发</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:#f6f9fc;color:#17354c}
header{display:flex;align-items:center;gap:20px;padding:16px 28px;background:#16344b;color:#fff;flex-wrap:wrap}header strong{font-size:20px;white-space:nowrap}header a{color:inherit;text-decoration:none}header a:last-child{margin-left:auto}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 60px)}
nav{padding:28px 18px;background:#edf2f7;border-right:1px solid #d5e0e8}nav h2{font-size:16px;margin:0 0 18px}
nav h3{font-size:14px;color:#557080;font-weight:500}
nav a{display:block;text-decoration:none;color:#23516a;padding:12px 14px;border-left:3px solid transparent}
nav a[aria-current]{background:#dceef0;border-left-color:#238779;color:#184f48}
main{padding:30px;min-width:0}h1{font-size:24px;margin:0 0 18px}video{display:block;width:100%;aspect-ratio:16/9;background:#101418;border-radius:4px}
.meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}.meta span{color:#657e8c}.meta a{color:#126d80;margin-left:auto}
#error{color:#9d2727}a:focus-visible{outline:3px solid #269b91;outline-offset:3px}
@media(max-width:800px){.layout{display:flex;flex-direction:column}nav{padding:14px 18px;border-right:0;border-bottom:1px solid #d5e0e8}nav h2{margin-bottom:6px}nav h3{margin:6px 0}main{padding:20px 14px}h1{font-size:20px}header{padding:12px 16px;font-size:14px}}
</style>
</head>
<body>
<header><a href="index.html">动手学昇腾算子开发</a><strong>视频课程</strong><a href="index.html">返回讲义</a></header>
<div class="layout">
<nav aria-label="视频目录"><h2>视频目录</h2><h3>第一章 · Add 算子</h3><a href="#1.1" aria-current="page">1.1 认识昇腾算子开发</a><a href="#1.2">1.2 实现第一个 Add 算子</a></nav>
<main>
<h1>1.1 认识昇腾算子开发</h1>
<video id="player" controls playsinline preload="metadata" poster="assets/slide-0.jpg" aria-label="1.1 认识昇腾算子开发"><source src="assets/videos/lesson-1-1.mp4" type="video/mp4">当前浏览器无法播放视频。</video>
<p id="error" hidden>视频加载失败。请刷新重试，或使用下方链接直接打开视频。</p>
<div class="meta"><span id="duration">第一章 · 第 1 节</span><a href="index.html#lesson-1-1">阅读对应讲义</a><a href="assets/videos/lesson-1-1.mp4">打开视频文件</a></div>
</main>
</div>
<script>
const player=document.querySelector('#player');
const lessons={'1.1':['认识昇腾算子开发',0],'1.2':['实现第一个 Add 算子',4]};
let lesson='1.1';
function selectLesson(){lesson=Object.hasOwn(lessons,location.hash.slice(1))?location.hash.slice(1):'1.1';const [title,poster]=lessons[lesson],url='assets/videos/lesson-'+lesson.replace('.','-')+'.mp4';
player.pause();player.poster='assets/slide-'+poster+'.jpg';player.src=url;player.setAttribute('aria-label',lesson+' '+title);document.querySelector('h1').textContent=lesson+' '+title;document.querySelector('#duration').textContent='第一章 · 第 '+lesson.split('.')[1]+' 节';document.querySelector('#error').hidden=true;
const links=document.querySelectorAll('.meta a');links[0].href='index.html#lesson-'+lesson.replace('.','-');links[1].href=url;
document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+lesson)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});player.load();}
window.addEventListener('hashchange',selectLesson);selectLesson();
player.addEventListener('loadedmetadata',()=>{const seconds=Math.floor(player.duration);if(Number.isFinite(seconds))document.querySelector('#duration').textContent='第一章 · 第 '+lesson.split('.')[1]+' 节 · '+Math.floor(seconds/60)+' 分 '+seconds%60+' 秒';});
player.addEventListener('error',()=>document.querySelector('#error').hidden=false);
player.querySelector('source').addEventListener('error',()=>document.querySelector('#error').hidden=false);
</script>
</body>
</html>
