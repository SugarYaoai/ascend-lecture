<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动手学昇腾算子开发</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/vs2015.min.css">
  <style>
    :root {
      --ink: #172033;
      --muted: #5f6b7e;
      --line: #dce3ec;
      --paper: #ffffff;
      --page: #f5f7fa;
      --navy: #173a63;
      --blue: #146bb7;
      --cyan: #008b99;
      --code: #0f1724;
      --code-line: #243247;
      --table-head: #eaf1f8;
      --sidebar-width: 272px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background-color: #edf3f7;
      background-image: url("assets/backgrounds/ascend-npu-circuit-pattern.png");
      background-position: center top;
      background-size: 1680px auto;
      background-attachment: fixed;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.78;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      height: 58px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      color: #fff;
      background: var(--navy);
      border-bottom: 1px solid rgba(255, 255, 255, .14);
    }

    .reading-progress {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      background: rgba(255, 255, 255, .16);
    }
    .reading-progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: #73d9d0;
      transition: width .12s linear;
    }

    .brand { font-weight: 700; font-size: 16px; }
    .brand span { color: #8ee8ef; font-weight: 600; margin-left: 10px; }

    .shell {
      width: min(1440px, 100%);
      min-height: calc(100vh - 58px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      padding: 30px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #edf2f7;
    }

    .toc-label {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    #toc { display: grid; gap: 3px; }
    #toc a {
      display: block;
      padding: 7px 10px;
      color: #40526a;
      text-decoration: none;
      border-left: 2px solid transparent;
      font-size: 14px;
      line-height: 1.45;
    }
    #toc a.level-3 { padding-left: 22px; font-size: 13px; }
    #toc a.level-4 { padding-left: 36px; font-size: 13px; font-weight: 600; }
    #toc a.level-5 { padding-left: 48px; font-size: 12px; }
    #toc a.chapter-heading {
      margin-top: 22px;
      padding: 10px;
      color: #0d315e;
      background: #e8f1fb;
      border-left: 4px solid #0a66c2;
      font-weight: 700;
    }
    #toc a.part-heading {
      margin-top: 16px;
      padding: 9px 10px;
      color: #173a63;
      background: #dfeaf4;
      border-left: 3px solid #146bb7;
      font-weight: 700;
    }
    #toc a:hover, #toc a.active {
      color: var(--blue);
      border-left-color: var(--blue);
      background: #fff;
    }
    #toc a.active {
      font-weight: 700;
      box-shadow: 0 2px 7px rgba(20, 107, 183, .12);
    }

    main {
      min-width: 0;
      padding: 46px clamp(26px, 6vw, 88px) 86px;
      background: #f6f9fc;
      border-left: 1px solid rgba(180, 201, 219, .72);
      border-right: 1px solid rgba(180, 201, 219, .72);
    }

    article { max-width: 900px; margin: 0 auto; }
    article > h1:first-child { margin-top: 0; }
    .chapter-intro {
      position: relative;
      margin: 2px 0 44px;
      padding: 26px 28px 25px;
      overflow: hidden;
      color: #153b66;
      background: #e7f1fa;
      border: 1px solid #b9d5e9;
      border-left: 6px solid #146bb7;
      border-radius: 6px;
    }
    .chapter-intro::after {
      position: absolute;
      top: -46px;
      right: -25px;
      width: 180px;
      height: 180px;
      border: 1px solid #9acbe5;
      border-radius: 50%;
      content: "";
    }
    .chapter-intro-label {
      display: block;
      margin-bottom: 7px;
      color: #087d8a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
    }
    .chapter-intro h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0;
      color: #102f50;
      border: 0;
      font-size: 27px;
    }
    .chapter-intro p {
      position: relative;
      z-index: 1;
      max-width: 660px;
      margin: 10px 0 0;
      color: #40617e;
      font-size: 15px;
    }

    h1, h2, h3, h4, h5 {
      color: var(--ink);
      line-height: 1.3;
      scroll-margin-top: 82px;
    }
    h1 {
      margin: 0 0 28px;
      padding-bottom: 18px;
      font-size: 34px;
      letter-spacing: 0;
      border-bottom: 3px solid var(--blue);
    }
    h2 {
      margin: 50px 0 20px;
      padding-bottom: 9px;
      font-size: 24px;
      border-bottom: 1px solid var(--line);
    }
    h3 {
      margin: 30px 0 18px;
      padding: 11px 14px;
      color: #10365f;
      background: #e8f2fb;
      border-top: 1px solid #bed8ef;
      border-bottom: 1px solid #bed8ef;
      border-left: 5px solid var(--blue);
      font-size: 19px;
    }
    h4 {
      margin: 42px 0 18px;
      padding: 0 0 10px;
      color: #10365f;
      border-bottom: 2px solid #b9d3e9;
      font-size: 22px;
      font-weight: 700;
    }
    h5 {
      margin: 28px 0 14px;
      padding: 3px 0 3px 12px;
      color: #1b4f78;
      border-left: 4px solid var(--cyan);
      font-size: 18px;
      font-weight: 700;
    }
    article hr {
      height: 0;
      margin: 58px 0 0;
      border: 0;
      border-top: 2px solid #9ec4e5;
    }
    p { margin: 14px 0; }
    a { color: var(--blue); }
    strong { color: #102f50; }
    .glossary-term {
      position: relative;
      color: #0c5c8d;
      border-bottom: 1px dashed #78a9c8;
      cursor: help;
    }
    .glossary-term::after {
      position: absolute;
      z-index: 8;
      bottom: calc(100% + 7px);
      left: 50%;
      width: min(260px, 68vw);
      padding: 8px 10px;
      color: #e7f0f7;
      background: #173a63;
      border: 1px solid #31567f;
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(17, 42, 70, .22);
      content: attr(data-tooltip);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.55;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: opacity .14s ease, transform .14s ease;
    }
    .glossary-term:hover::after, .glossary-term:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    code {
      padding: .12em .35em;
      color: #a21b42;
      background: #f1f3f6;
      border-radius: 3px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: .88em;
    }

    pre {
      position: relative;
      margin: 20px 0 26px;
      padding: 19px 22px;
      overflow: auto;
      background: #1e1e1e;
      border: 1px solid #303030;
      border-radius: 6px;
      box-shadow: inset 3px 0 0 #007acc;
    }
    .code-language {
      position: absolute;
      top: 9px;
      right: 66px;
      padding: 2px 7px;
      color: #91a5bf;
      border: 1px solid #3b4b61;
      border-radius: 3px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.35;
      opacity: .78;
    }
    .copy-code {
      position: absolute;
      top: 8px;
      right: 10px;
      min-width: 46px;
      padding: 3px 8px;
      color: #dbe7f5;
      background: #26364b;
      border: 1px solid #43546b;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      transition: opacity .15s ease, background .15s ease;
    }
    pre:hover .copy-code, pre:focus-within .copy-code { opacity: 1; }
    .copy-code:hover { background: #0b6e8a; }
    .copy-code.copied { color: #062f32; background: #70d7ca; border-color: #70d7ca; }
    pre code {
      padding: 0;
      color: #d4d4d4;
      background: transparent;
      font-size: 13px;
      line-height: 1.65;
    }
    pre code.hljs { color: #d4d4d4; background: transparent; }
    pre.dataflow {
      padding: 18px 22px;
      background: #101a2a;
      border-color: #203956;
      box-shadow: inset 3px 0 0 #19b7c6;
    }
    pre.dataflow code {
      display: block;
      color: #d8e3f2;
      font-size: 14px;
      line-height: 1.75;
    }
    .flow-host { color: #f0b76a; font-weight: 700; }
    .flow-gm { color: #63c7ff; font-weight: 700; }
    .flow-ub { color: #85deab; font-weight: 700; }
   .flow-core { color: #cba8ff; font-weight: 700; }
   .flow-block { color: #f2d36d; font-weight: 700; }
    .flow-range { color: #85deab; font-weight: 700; }
    .flow-op { color: #67d4c8; font-weight: 700; }
    .flow-arrow { color: #86a3c4; font-weight: 700; }
    .flow-judge { color: #f0b76a; font-weight: 700; }
    .flow-entry { color: #63c7ff; font-weight: 700; }
    .flow-kernel { color: #cba8ff; font-weight: 700; }
    .flow-result { color: #85deab; font-weight: 700; }

    .api-compare {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 20px 0 26px;
    }
    .api-compare-side {
      min-width: 0;
      padding: 12px;
      border: 1px solid;
      border-radius: 6px;
    }
    .api-compare-side.c-api {
      background: #fff7ed;
      border-color: #f2c996;
    }
    .api-compare-side.cpp-api {
      background: #eef8f8;
      border-color: #9fd8d2;
    }
    .api-compare-label {
      display: block;
      margin: 0 0 9px;
      font-size: 13px;
      font-weight: 700;
    }
    .c-api .api-compare-label { color: #9a4d13; }
    .cpp-api .api-compare-label { color: #08736f; }
    .api-compare-side pre {
      margin: 0;
      padding: 14px 16px;
      box-shadow: inset 3px 0 0 #007acc;
    }
    .api-compare-side.c-api pre { box-shadow: inset 3px 0 0 #d97720; }
    .api-compare-side.cpp-api pre { box-shadow: inset 3px 0 0 #00988f; }

    table {
      width: 100%;
      margin: 19px 0 24px;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td { padding: 10px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: #173a63; background: var(--table-head); font-weight: 700; }
    tr:nth-child(even) td { background: #fafbfd; }

    ul, ol { padding-left: 25px; }
    blockquote {
      position: relative;
      margin: 22px 0;
      padding: 16px 18px 16px 20px;
      color: #38516b;
      background: #edf7f8;
      border: 1px solid #b8dfe0;
      border-left: 5px solid var(--cyan);
      border-radius: 0 5px 5px 0;
      box-shadow: 0 5px 14px rgba(19, 82, 105, .06);
    }
    blockquote::before {
      display: block;
      margin-bottom: 5px;
      color: #08736f;
      content: "知识提示";
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    blockquote p { margin: 0; }
    blockquote.knowledge-warning {
      color: #694716;
      background: #fff8e9;
      border-color: #efd095;
      border-left-color: #d78b24;
    }
    blockquote.knowledge-warning::before { color: #a85c09; content: "硬件约束"; }

    article img {
      display: block;
      width: 100%;
      height: auto;
      margin: 22px 0 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 4px 18px rgba(23, 58, 99, .12);
      cursor: zoom-in;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    article img:hover { transform: translateY(-2px); box-shadow: 0 9px 24px rgba(23, 58, 99, .17); }
    article img + em {
      display: block;
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .image-lightbox {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(8, 20, 35, .82);
    }
    .image-lightbox.open { display: grid; }
    .image-lightbox img {
      display: block;
      max-width: min(1200px, 94vw);
      max-height: 82vh;
      border: 1px solid rgba(255, 255, 255, .38);
      border-radius: 4px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, .4);
    }
    .image-lightbox p {
      max-width: min(1200px, 94vw);
      margin: 12px 0 0;
      color: #dce9f3;
      font-size: 13px;
      text-align: center;
    }

    .loading, .error {
      margin: 90px auto;
      max-width: 760px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      .topbar { padding: 0 18px; }
      .brand span { display: none; }
      .shell { display: block; }
      aside { display: none; }
      main { padding: 32px 20px 58px; }
      h1 { font-size: 28px; }
      h2 { font-size: 22px; }
      h3 { font-size: 18px; }
      h4 { font-size: 20px; }
      h5 { font-size: 17px; }
      .api-compare { grid-template-columns: 1fr; }
      pre { margin-left: -4px; margin-right: -4px; padding: 16px; }
      .copy-code { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Ascend C <span>动手学昇腾算子开发</span></div>
    <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>
  </header>
  <div class="shell">
    <aside aria-label="文档目录">
      <p class="toc-label">目录</p>
      <nav id="toc"></nav>
    </aside>
    <main>
      <article id="content"><p class="loading">正在加载讲义...</p></article>
    </main>
  </div>
  <div class="image-lightbox" id="image-lightbox" role="dialog" aria-modal="true" aria-label="放大图片">
    <div>
      <img id="lightbox-image" alt="">
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script>
    const sourceFiles = [
      "./chapter1_overview.md",
      "./step1_add_kernel_lecture.md",
      "./part2_tensoroj_add_simple.md",
      "./part3_tensoroj_cpp_api.md",
      "./part4_add_medium_tiling.md",
      "./part5_double_buffering.md",
      "./appendix_glossary.md"
    ];
    const content = document.getElementById("content");
    const toc = document.getElementById("toc");
    const readingProgressBar = document.getElementById("reading-progress-bar");
    const imageLightbox = document.getElementById("image-lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCaption = document.getElementById("lightbox-caption");

    marked.setOptions({ gfm: true, breaks: false });

    function slugify(text, index) {
      return `section-${index}-${text.trim().toLowerCase().replace(/[^\\w\\u4e00-\\u9fff]+/g, "-")}`;
    }

    function buildToc() {
      const headings = [...content.querySelectorAll("h2, h3, h4, h5")];
      headings.forEach((heading, index) => {
        heading.id = slugify(heading.textContent, index);
        const link = document.createElement("a");
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent;
        link.className = `level-${heading.tagName.slice(1)}`;
        if (heading.tagName === "H2") link.classList.add("chapter-heading");
        if (heading.tagName === "H3") link.classList.add("part-heading");
        toc.appendChild(link);
      });

      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting);
        if (!visible.length) return;
        const current = visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0].target.id;
        toc.querySelectorAll("a").forEach((link) => link.classList.toggle("active", link.hash === `#${current}`));
      }, { rootMargin: "-82px 0px -70% 0px" });
      headings.forEach((heading) => observer.observe(heading));
    }

    function enhanceChapterHeaders() {
      const chapterSummaries = {
        "第一章 从 Add 开始理解昇腾算子开发": "从硬件架构、数据流动到双缓冲优化，建立编写昇腾算子的完整基础。",
        "附录 术语表": "按执行、内存、接口与性能优化分类，便于随时回查本书术语。"
      };
      content.querySelectorAll("h2").forEach((heading) => {
        const wrapper = document.createElement("section");
        wrapper.className = "chapter-intro";
        const label = document.createElement("span");
        label.className = "chapter-intro-label";
        label.textContent = heading.textContent.startsWith("附录") ? "REFERENCE" : "CHAPTER";
        const summary = document.createElement("p");
        summary.textContent = chapterSummaries[heading.textContent] || "围绕算子实现建立清晰的硬件与代码视角。";
        heading.parentNode.insertBefore(wrapper, heading);
        wrapper.append(label, heading, summary);
      });
    }

    function enhanceGlossaryTerms() {
      const glossary = {
        "AI Core": "NPU 内实际执行核函数的物理计算核心。",
        "Global Memory": "NPU 设备侧的大容量共享内存，简称 GM。",
        "Unified Buffer": "AI Core 内的片上高速存储，简称 UB。",
        "Host Memory": "CPU 一侧的系统内存，简称 HM。",
        "GlobalTensor": "描述 GM 中连续数据范围的张量视图。",
        "LocalTensor": "描述 UB 中局部数据范围的张量视图。",
        "LocalMemAllocator": "从当前 AI Core 的 UB 中分配局部张量的对象。",
        "PipeBarrier": "表达当前 AI Core 内不同阶段的数据依赖。",
        "block_idx": "当前 Block 的逻辑编号，不等同于固定的物理 AI Core 编号。",
        "Kernel": "运行在 NPU 设备端、执行实际计算的核函数。",
        "Block": "同一份 Kernel 的一个逻辑执行任务。",
        "Tile": "一个 Block 内可以放入 UB 的一小段连续数据。",
        "TPipe": "在 UB 中划分并初始化缓冲区的资源管理对象。",
        "TQue": "在流水线阶段之间传递 LocalTensor 的队列。",
        "MTE": "负责 GM 与 UB 之间数据搬运的内存传输引擎。",
        "GM": "Global Memory 的缩写，NPU 侧共享的大容量内存。",
        "UB": "Unified Buffer 的缩写，AI Core 内的片上高速存储。"
      };
      const terms = Object.keys(glossary).sort((a, b) => b.length - a.length);
      const pattern = new RegExp(`(${terms.map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "g");
      const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!node.nodeValue.trim() || parent.closest("pre, code, a, script, style, .glossary-term")) return NodeFilter.FILTER_REJECT;
          pattern.lastIndex = 0;
          return pattern.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
      });
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        node.nodeValue.replace(pattern, (term, _capture, offset) => {
          fragment.append(document.createTextNode(node.nodeValue.slice(cursor, offset)));
          const span = document.createElement("span");
          span.className = "glossary-term";
          span.tabIndex = 0;
          span.textContent = term;
          span.dataset.tooltip = glossary[term];
          fragment.append(span);
          cursor = offset + term.length;
          return term;
        });
        fragment.append(document.createTextNode(node.nodeValue.slice(cursor)));
        node.replaceWith(fragment);
      });
    }

    function enhanceImages() {
      content.querySelectorAll("img").forEach((image) => {
        image.tabIndex = 0;
        image.setAttribute("role", "button");
        image.setAttribute("aria-label", "点击放大图片");
        const open = () => {
          lightboxImage.src = image.currentSrc || image.src;
          lightboxImage.alt = image.alt;
          lightboxCaption.textContent = image.nextElementSibling?.tagName === "EM" ? image.nextElementSibling.textContent : image.alt;
          imageLightbox.classList.add("open");
        };
        image.addEventListener("click", open);
        image.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
        });
      });
      imageLightbox.addEventListener("click", (event) => {
        if (event.target === imageLightbox) imageLightbox.classList.remove("open");
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") imageLightbox.classList.remove("open");
      });
    }

   function colorDataFlow(block) {
      const raw = block.textContent;
      const isDataFlow = /Host Memory|Global Memory|\bUB\b|AI Core|Block \d+|asc_copy|aclrtMemcpy/.test(raw);
      if (!isDataFlow) return;

      block.parentElement.classList.add("dataflow");
      const escaped = raw.replace(/[&<>]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[char]);
      block.innerHTML = escaped
        .replace(/(Host Memory|CPU \/ Host|Host)/g, '<span class="flow-host">$1</span>')
        .replace(/(Global Memory|Device Global Memory|\bGM\b)/g, '<span class="flow-gm">$1</span>')
        .replace(/(x_local, y_local, z_local|UB: x_local, y_local|UB: z_local|\bUB\b)/g, '<span class="flow-ub">$1</span>')
        .replace(/(AI Core \d+|AI Core)/g, '<span class="flow-core">$1</span>')
        .replace(/(Block \d+|\d+ 个 Block)/g, '<span class="flow-block">$1</span>')
        .replace(/(\[\d+, \d+\))/g, '<span class="flow-range">$1</span>')
        .replace(/(aclrtMemcpy|asc_copy_gm2ub|asc_copy_ub2gm|asc_add)/g, '<span class="flow-op">$1</span>')
        .replace(/(^[ \t]*)(\||v)(?=\r?$)/gm, '$1<span class="flow-arrow">$2</span>')
       .replace(/(↓|→|&lt;-)/g, '<span class="flow-arrow">$1</span>');
   }

    function renderDisplayMath(markdown) {
      const formulas = [];
      const preparedMarkdown = markdown.replace(/^\$\$\s*\r?\n([\s\S]*?)\r?\n\$\$\s*$/gm, (_, latex) => {
        const formulaIndex = formulas.push(latex.trim()) - 1;
        return `\n\n<div class="math-block" data-formula-index="${formulaIndex}"></div>\n\n`;
      });

      content.innerHTML = marked.parse(preparedMarkdown);
      content.querySelectorAll(".math-block").forEach((element) => {
        const latex = formulas[Number(element.dataset.formulaIndex)];
        katex.render(latex, element, { displayMode: true, throwOnError: false });
      });
    }

    function enhanceKnowledgeCards() {
      content.querySelectorAll("blockquote").forEach((card) => {
        const title = card.querySelector("strong")?.textContent.trim() || "";
        if (title.includes("约束") || title.includes("注意")) {
          card.classList.add("knowledge-warning");
        }
      });
    }

    function languageLabel(language) {
      const labels = { cpp: "C++", c: "C", cmake: "CMake", bash: "Bash", text: "流程图" };
      return labels[language] || (language ? language.toUpperCase() : "Code");
    }

    async function copyCode(text, button) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
      button.textContent = "已复制";
      button.classList.add("copied");
      window.setTimeout(() => {
        button.textContent = "复制";
        button.classList.remove("copied");
      }, 1300);
    }

    function enhanceCodeBlocks() {
      content.querySelectorAll("pre code").forEach((block) => {
        const language = [...block.classList]
          .find((name) => name.startsWith("language-"))
          ?.replace("language-", "");
        const pre = block.parentElement;
        const label = document.createElement("span");
        label.className = "code-language";
        label.textContent = languageLabel(language);
        pre.appendChild(label);

        const button = document.createElement("button");
        button.className = "copy-code";
        button.type = "button";
        button.textContent = "复制";
        button.title = "复制代码";
        button.setAttribute("aria-label", "复制代码");
        button.addEventListener("click", () => copyCode(block.textContent, button));
        pre.appendChild(button);
      });
    }

    function updateReadingProgress() {
      const range = document.documentElement.scrollHeight - window.innerHeight;
      const percentage = range > 0 ? Math.min(100, Math.max(0, window.scrollY / range * 100)) : 0;
      readingProgressBar.style.width = `${percentage}%`;
    }

   Promise.all(sourceFiles.map((sourceFile) => fetch(sourceFile).then((response) => {
      if (!response.ok) throw new Error(`无法读取讲义（HTTP ${response.status}）`);
      return response.text();
    })))
      .then((documents) => {
        const markdown = documents.join("\n\n---\n\n");
        renderDisplayMath(markdown);
        content.querySelectorAll("pre code").forEach((block) => {
          block.classList.add("hljs");
          const language = [...block.classList]
            .find((name) => name.startsWith("language-"))
            ?.replace("language-", "");
          if (window.hljs && language && window.hljs.getLanguage(language)) {
            hljs.highlightElement(block);
          }
          if (language === "text") colorDataFlow(block);
        });
        enhanceKnowledgeCards();
        enhanceCodeBlocks();
        renderMathInElement(content, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ],
          throwOnError: false
        });
        enhanceChapterHeaders();
        enhanceGlossaryTerms();
        enhanceImages();
        buildToc();
        updateReadingProgress();
        window.addEventListener("scroll", updateReadingProgress, { passive: true });
        window.addEventListener("resize", updateReadingProgress);
      })
      .catch((error) => {
        content.innerHTML = `<p class="error">${error.message}</p>`;
      });
  </script>
</body>
